project_id = "grind_standalone_local"

[api]
enabled = true
port = 55521
schemas = ["public", "graphql_public", "grind"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55522
shadow_port = 55520
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = true
port = 55523
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55524

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["grind://auth/callback"]

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1m"
otp_length = 8

[analytics]
enabled = true
port = 55527
backend = "postgres"
